name: Deploy to Amazon EKS

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tofai-backend
  EKS_CLUSTER_NAME: tofai-cluster
  KUBECONFIG_SECRET_NAME: kubeconfig

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update kube config
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Generate secrets
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        REDIS_HOST: ${{ secrets.REDIS_HOST }}
        REDIS_PORT: ${{ secrets.REDIS_PORT }}
        REDIS_USER: ${{ secrets.REDIS_USER }}
        REDIS_SECRET: ${{ secrets.REDIS_SECRET }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GEMINI_API_PROJECT_NUMBER: ${{ secrets.GEMINI_API_PROJECT_NUMBER }}
        GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        ELEVEN_TTS_SECRET: ${{ secrets.ELEVEN_TTS_SECRET }}
        GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
        GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ env.AWS_REGION }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        S3_REGION: ${{ secrets.S3_REGION }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
        COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
        COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
        COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
        COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
        COGNITO_REDIRECT_URL: ${{ secrets.COGNITO_REDIRECT_URL }}
        COGNITO_LOGOUT_URL: ${{ secrets.COGNITO_LOGOUT_URL }}
        COGNITO_SCOPE: ${{ secrets.COGNITO_SCOPE }}
        COGNITO_TOKEN_SIGNING_URL: ${{ secrets.COGNITO_TOKEN_SIGNING_URL }}
      run: |
        chmod +x ./scripts/generate-k8s-secrets.sh
        ./scripts/generate-k8s-secrets.sh

    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
      run: |
        # Replace placeholders in Kubernetes manifests
        sed -i "s|\${ECR_REPOSITORY_URI}|$ECR_REGISTRY/$ECR_REPOSITORY|g" k8s/deployment.yaml
        sed -i "s|\${IMAGE_TAG}|$IMAGE_TAG|g" k8s/deployment.yaml
        sed -i "s|\${CERTIFICATE_ARN}|$CERTIFICATE_ARN|g" k8s/ingress.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        
        # Wait for deployment to complete
        kubectl rollout status deployment/tofai-backend --timeout=5m