apiVersion: apps/v1
kind: Deployment
metadata:
  name: tofai-backend
  labels:
    app: tofai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tofai-backend
  template:
    metadata:
      labels:
        app: tofai-backend
    spec:
      containers:
      - name: tofai-backend
        image: ${ECR_REPOSITORY_URI}:${IMAGE_TAG}
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: PORT
          value: "8000"
        envFrom:
        - secretRef:
            name: tofai-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5